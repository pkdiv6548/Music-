<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player - अपना संगीत, अपनी धुन</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Music<span>Player</span></h1>
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="home">
                    <i class="fas fa-home"></i>
                    <span>होम</span>
                </a>
                <a href="#" class="nav-item" data-view="library">
                    <i class="fas fa-library"></i>
                    <span>लाइब्रेरी</span>
                </a>
                <a href="#" class="nav-item" data-view="playlists">
                    <i class="fas fa-list"></i>
                    <span>प्लेलिस्ट</span>
                </a>
                <a href="#" class="nav-item" data-view="favorites">
                    <i class="fas fa-heart"></i>
                    <span>पसंदीदा</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="upload-btn" id="uploadBtn">
                    <i class="fas fa-upload"></i>
                    <span>संगीत अपलोड करें</span>
                </button>
                <input type="file" id="fileInput" accept="audio/*" multiple hidden>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="गाने, कलाकार, एल्बम खोजें...">
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle" title="थीम बदलें">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>

            <!-- Views -->
            <div class="views-container">
                <!-- Home View -->
                <section class="view active" id="homeView">
                    <div class="hero-section">
                        <h2>आपका संगीत, <span>आपकी दुनिया</span></h2>
                        <p>अपने पसंदीदा गाने सुनें, नए गाने खोजें</p>
                    </div>
                    
                    <div class="section-header">
                        <h3>🔥 ट्रेंडिंग गाने</h3>
                        <button class="view-all-btn">सभी देखें <i class="fas fa-arrow-right"></i></button>
                    </div>
                    <div class="song-grid" id="trendingGrid"></div>

                    <div class="section-header">
                        <h3>🎵 हाल ही में सुने गए</h3>
                    </div>
                    <div class="song-grid" id="recentGrid"></div>
                </section>

                <!-- Library View -->
                <section class="view" id="libraryView">
                    <div class="section-header">
                        <h3>📚 आपकी लाइब्रेरी</h3>
                        <span class="song-count" id="libraryCount">0 गाने</span>
                    </div>
                    <div class="library-list" id="libraryList"></div>
                </section>

                <!-- Playlists View -->
                <section class="view" id="playlistsView">
                    <div class="section-header">
                        <h3>📋 प्लेलिस्ट</h3>
                        <button class="create-playlist-btn" id="createPlaylistBtn">
                            <i class="fas fa-plus"></i> नई प्लेलिस्ट
                        </button>
                    </div>
                    <div class="playlists-grid" id="playlistsGrid"></div>
                </section>

                <!-- Favorites View -->
                <section class="view" id="favoritesView">
                    <div class="section-header">
                        <h3>❤️ पसंदीदा गाने</h3>
                        <span class="song-count" id="favoritesCount">0 गाने</span>
                    </div>
                    <div class="library-list" id="favoritesList"></div>
                </section>
            </div>
        </main>

        <!-- Now Playing Bar -->
        <div class="now-playing-bar" id="nowPlayingBar">
            <div class="song-info">
                <div class="song-thumbnail" id="currentThumbnail">
                    <i class="fas fa-music"></i>
                </div>
                <div class="song-details">
                    <h4 id="currentTitle">कोई गाना नहीं चुना गया</h4>
                    <p id="currentArtist">गाना चुनें और सुनना शुरू करें</p>
                </div>
                <button class="fav-btn" id="favBtn" title="पसंदीदा में जोड़ें">
                    <i class="far fa-heart"></i>
                </button>
            </div>

            <div class="player-controls">
                <div class="controls-top">
                    <button class="control-btn" id="shuffleBtn" title="शफल">
                        <i class="fas fa-random"></i>
                    </button>
                    <button class="control-btn" id="prevBtn" title="पिछला">
                        <i class="fas fa-backward"></i>
                    </button>
                    <button class="play-btn" id="playBtn" title="चलाएं">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="control-btn" id="nextBtn" title="अगला">
                        <i class="fas fa-forward"></i>
                    </button>
                    <button class="control-btn" id="repeatBtn" title="दोहराएं">
                        <i class="fas fa-repeat"></i>
                    </button>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                    <span class="time" id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-control">
                <button class="control-btn" id="volumeBtn" title="वॉल्यूम">
                    <i class="fas fa-volume-up"></i>
                </button>
                <input type="range" class="volume-bar" id="volumeBar" min="0" max="100" value="70">
            </div>
        </div>
    </div>

    <!-- Playlist Modal -->
    <div class="modal" id="playlistModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>नई प्लेलिस्ट बनाएं</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="playlistNameInput" placeholder="प्लेलिस्ट का नाम">
                <div class="playlist-songs" id="playlistSongsList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="savePlaylistBtn">सहेजें</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/player.js"></script>
    <script src="js/playlist.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
